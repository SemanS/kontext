# cargo-deny (https://embarkstudios.github.io/cargo-deny/): run by the `deny` job in
# .github/workflows/ci.yml. Locally: `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
# RustSec advisories fail the advisories check (its CI job does not block a merge: a new advisory
# turns it red without a change here). Ignore one only with its id and a reason.
ignore = [
    # zstd 0.13 / zstd-safe 7 are pinned by tantivy 0.26; the fixed lines (0.14.3, 8.2.0) need a tantivy
    # upgrade. kontext uses zstd only for its own derived index's docstore, never on untrusted input.
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.14.3 is unreachable behind tantivy 0.26; only the local index is compressed" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 8.2.0 is unreachable behind tantivy 0.26; only the local index is compressed" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 8.2.0 is unreachable behind tantivy 0.26; only the local index is compressed" },
]

[licenses]
version = 2
# kontext is MIT OR Apache-2.0; every dependency must allow redistribution under it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "zlib-acknowledgement",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
