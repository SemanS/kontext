# cargo-deny (https://embarkstudios.github.io/cargo-deny/): run by the `deny` job in
# .github/workflows/ci.yml. Locally: `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
# RustSec advisories fail the advisories check (its CI job does not block a merge: a new advisory
# turns it red without a change here). Ignore one only with its id and a reason.
ignore = []

[licenses]
version = 2
# kontext is MIT OR Apache-2.0; every dependency must allow redistribution under it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "zlib-acknowledgement",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
