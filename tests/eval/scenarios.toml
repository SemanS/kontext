# Evaluation scenarios for kontext (see tests/eval.rs and tests/eval/README.md).
#
# Each scenario starts from a fresh copy of tests/eval/fixtures/<fixture> (default `shop`),
# committed once on 2026-05-01. Steps run in order:
#   write = "path", content = "…"     write a file (`{root}`, `{wt}`, `{head}` are expanded)
#   remove = "path"                   delete a file or directory
#   touch = "path", times = N         N commits that each change the file
#   git = [args]                      a git command (date = "…" sets author and committer date)
#   run = [args]                      a kontext command; scored when it has expectations:
#     expect = [..]   must appear (found / missed)
#     keep = [..]     exists in the sources and must not be dropped (wrongly suppressed)
#     forbid = [..]   must not appear (noise)
#     rank = { "needle" = N }         the first numbered hit containing needle is within the top N
#     max_tokens = N                  output size limit (chars / 4)
# `pending = "<item>"` marks behaviour not built yet: reported, not asserted.

# ------------------------------------------------------------------------------------- 1.1

[[scenario]]
name = "proposed vs accepted in the brief"
item = "1.1"
[[scenario.step]]
run = ["brief", "--focus", "src/search", "--focus", "src/orders", "--no-adapters"]
expect = ["Move product search to OpenSearch (proposed)", "Orders live in PostgreSQL —"]
forbid = ["(accepted)"]

[[scenario]]
name = "deprecated entry marked in search"
item = "1.1"
[[scenario.step]]
run = ["search", "cache product pages"]
expect = ["Cache product pages for five minutes", "deprecated"]
forbid = ["accepted"]

[[scenario]]
name = "locally edited entry is not presented as approved"
item = "1.1"
[[scenario.step]]
write = ".ai/decisions/2026-01-10-orders-live-in-postgresql.md"
content = """---
id: 2026-01-10-orders-live-in-postgresql
kind: decision
title: Orders live in PostgreSQL
status: accepted
date: 2026-01-10
paths: [src/orders/**]
---

## Decision

Orders live in one PostgreSQL database; stock moves to Redis.
"""
[[scenario.step]]
run = ["brief", "--focus", "src/orders", "--no-adapters"]
expect = ["Orders live in PostgreSQL (local, unapproved)"]
[[scenario.step]]
run = ["search", "orders postgresql"]
expect = ["local, unapproved"]

