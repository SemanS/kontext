run = ["search", "orders postgresql"]
expect = ["<kx:2026-01-10-orders-live-in-postgresql>"]
keep = ["<mem://notes/replica-lag>"]
forbid = ["<mem://team/decision/", "<mem://notes/copied-note>"]

