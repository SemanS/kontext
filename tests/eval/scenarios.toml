write = ".git/memory.json"
content = """{"hits": [
 {"title": "Orders live in PostgreSQL", "snippet": "Orders live in one PostgreSQL database; an order and its items are written in one transaction.", "uri": "mem://team/decision/2026-01-10-orders-live-in-postgresql.md"},
 {"title": "Orders live in PostgreSQL", "snippet": "Orders live in one PostgreSQL database; an order and its items are written in one transaction.", "uri": "mem://notes/copied-note"},
 {"title": "Orders live in PostgreSQL", "snippet": "Orders live in one PostgreSQL database; an order and its items are written in one transaction. Since March the reporting replica lags up to a minute.", "uri": "mem://notes/replica-lag"}
]}"""
[[scenario.step]]
write = ".git/kontext/config.toml"
content = """
[adapters.mem]
driver = "command"
[adapters.mem.ops.search]
command = ["cat", "{root}/.git/memory.json"]
format = "json"
"""
