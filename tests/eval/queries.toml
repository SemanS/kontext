# Graded retrieval queries over the `shop` fixture (tests/eval/fixtures/shop), judged in
# tests/eval/qrels.tsv (TREC format: query_id 0 uri grade; grade 3 = the answer, 2 = also
# answers, 1 = related). Decision 13: a ranking change lands with these numbers (nDCG@k, recall@k).
#
# Slices:
#   exact-identifier  the query names the thing as it is written (title words, ids, identifiers)
#   plural            the query uses another inflection than the text (retry / retries, key / keys)
#   slovak            Slovak, typed without diacritics or in another case
#   paraphrase        the query says it in other words (a semantic adapter's ground; BM25 baseline)

